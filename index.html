<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DASHBOAR MONITORING APOTEK</title>
  <link rel="icon" href="https://drive.google.com/file/d/1RANjutHtsp3MsOrddis0gPnGfCIQDZUa/view?usp=sharing" />
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #eee;
      overflow: hidden;
      /* Mencegah scroll ganda */
    }

    .iframe-container {
      width: 100%;
      height: 100dvh;
      /* Menggunakan dvh agar pas di mobile browser */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <div class="iframe-container">
    <iframe id="app"
      src="https://script.google.com/macros/s/AKfycbyzPSeH64ipeJa1k-AbeT-wL6BWD-1yMRdc7jwiF6ZWZiIzR3swfCypQ45NyMdEVD_wjw/exec"
      allow="fullscreen; camera; microphone; display-capture; geolocation;">
    </iframe>
  </div>
</body>

</html>
